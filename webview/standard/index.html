<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JINS MEME — Standard</title>
<!-- 標準版: EOG(Vv・Vh)/ 加速度 / 角速度の 3 枚(common/raw_specs.js)。データがある列だけ描く(Standard モードは角速度なし、Quaternion は描くものなし)。
     zip の中では common/ がこのファイルの隣にある(webview/tools/make_zip.py が詰める)。仕様は webview/README.md。 -->
<link rel="stylesheet" href="common/ui.css">
</head>
<body>
<main id="app"></main>
<script type="module">
import { createViewer } from "./common/viewer.js";
import { rawSpecs } from "./common/raw_specs.js";

// グラフの余白は uPlot の既定の 0.4 倍(見出しとグラフの間 17 → 7 px、横軸の帯 50 → 31 px。高機能版と同じ。common/charts.js の layout)
createViewer(document.getElementById("app"), { specs: rawSpecs, chartLayout: { padTop: 7, xAxisSize: 31 } });

// 開発用(ブラウザで ?dev を付けて開いたときだけ): 模擬の計測・CSV の再生
if (new URLSearchParams(location.search).has("dev")) import("./common/dev.js");
</script>
</body>
</html>
